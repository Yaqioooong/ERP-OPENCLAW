<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>采购助手 · ERP</title>
  <script>
    // 在首帧前应用主题，避免闪白
    (function () {
      try {
        var saved = localStorage.getItem('erp-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'dark' || saved === 'light' ? saved : (dark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <style>
    html, body { background: #f6f5f1; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #111110; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
